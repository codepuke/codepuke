# Dev secrets, sourced from OpenBao via External Secrets Operator.
# Convention (ClusterSecretStore "openbao", kv-v2): kv path
# kv/<namespace>/<secret-name>, one kv field per Secret key. The database
# credential is the exception: its single source of truth lives under
# kv/postgres/ because the CNPG managed role reads the same values.
#
# Do NOT add conversionStrategy, decodingStrategy, or metadataPolicy to the
# refs; the homelab argocd config carries ignoreDifferences for those fields.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: codepuke-db-credentials
  namespace: codepuke-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: codepuke-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        uri: "postgresql://{{ .username }}:{{ .password }}@postgres-pooler.postgres.svc.cluster.local:5432/codepuke_dev"
  data:
    - secretKey: username
      remoteRef:
        key: postgres/codepuke-dev-db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: postgres/codepuke-dev-db-credentials
        property: password
---
# The admin surface's secrets: SESSION_KEY seals the cookie sessions,
# OIDC_CLIENT_SECRET belongs to the codepuke-dev Authentik application.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: codepuke-secrets
  namespace: codepuke-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: codepuke-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: codepuke-dev/codepuke-secrets
---
# Image pull secret: the raw config json is stored under the single field
# "dockerconfigjson" (no leading dot); the template rebuilds the Secret key
# Kubernetes expects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: codepuke-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: codepuke-dev/ghcr-pull-secret
        property: dockerconfigjson
