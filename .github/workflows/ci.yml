name: ci

on:
  pull_request:
  push:
    branches:
      - main

# Least-privilege default for the GITHUB_TOKEN; jobs opt in explicitly.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v _templ.go || true)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Store and web tests run against real Postgres via testcontainers;
      # the runner's Docker daemon serves them.
      - name: Test
        run: go test ./...

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Docker build smoke
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: codepuke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: codepuke:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # On green main only: publish so dev (ArgoCD tracking main) has an
      # image to pull. sha-<fullsha> is immutable; :dev is a moving tag.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push dev image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/codepuke/codepuke:sha-${{ github.sha }}
            ghcr.io/codepuke/codepuke:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Point the dev overlay at the image we just pushed; ArgoCD sources
  # deploy/overlays/dev from codepuke@main, so this commit rolls dev out.
  deploy-dev:
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Bump dev overlay image tag
        run: |
          sed -i "s|^\( *newTag:\).*|\1 sha-${{ github.sha }}|" deploy/overlays/dev/kustomization.yaml

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- deploy/overlays/dev/kustomization.yaml; then
            echo "Dev overlay already current; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/dev/kustomization.yaml
          git commit -m "ci(dev): deploy sha-${{ github.sha }} to dev.codepuke.com [skip ci]"
          git push origin main
